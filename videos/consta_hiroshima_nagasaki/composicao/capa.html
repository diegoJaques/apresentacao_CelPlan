<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><div id="c">

<div class="abs" style="left:532px;top:540px;width:16px;height:1100px;background:#D7262B"></div>
<div class="abs" style="left:0;right:0;top:540px;height:1100px;background:linear-gradient(#0b0a09 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 70%,#0b0a09 100%)"></div>
<div class="abs" style="z-index:4;left:300px;top:760px;width:480px;height:640px;background:#efeae0;padding:14px;box-shadow:0 20px 60px #000;transform:rotate(-2deg);border:6px solid #FFC233"><img src="tsutomu.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.15)"></div>
<div class="abs" style="left:0;right:0;top:110px;text-align:center"><span style="font-family:J;font-size:40px;letter-spacing:4px;background:#D7262B;padding:10px 24px;border-radius:8px">HISTÓRIA REAL · 1945</span></div>
<div class="abs" style="left:0;right:0;top:215px;text-align:center;font-size:132px;line-height:.98;text-shadow:0 10px 40px #000">SOBREVIVEU ÀS<br><span style="color:#FFC233">2 BOMBAS</span></div>
<div class="abs" style="left:0;right:0;top:1680px;text-align:center"><span style="display:inline-block;background:#fff;color:#111;font-size:84px;padding:10px 40px;border:8px solid #000;box-shadow:10px 10px 0 #D7262B;transform:rotate(-2deg)">3 DIAS DE DIFERENÇA</span></div>
