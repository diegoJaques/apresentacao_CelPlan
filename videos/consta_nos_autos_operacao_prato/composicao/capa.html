<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:O;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}
@font-face{font-family:J;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(#02040a 0%,#071427 50%,#0f2a2a 78%,#050806 100%);font-family:O;font-weight:700;color:#fff;text-transform:uppercase}
.abs{position:absolute}
.ufo{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff3c4 16%,rgba(255,190,80,.75) 32%,rgba(255,120,40,.22) 52%,rgba(0,0,0,0) 70%)}
.t{text-align:center;line-height:.9;text-shadow:0 10px 40px rgba(0,0,0,.9)}
</style></head><body><div id="c">
<canvas id="st" class="abs" width="1080" height="1920" style="left:0;top:0"></canvas>
<div class="abs" style="left:900px;top:740px;width:0;height:0;border-left:170px solid transparent;border-right:170px solid transparent;border-bottom:1300px solid rgba(255,220,140,.17);filter:blur(10px);transform:translateX(-170px) rotate(8deg);transform-origin:50% 0"></div>
<div class="ufo" style="left:800px;top:640px;width:200px;height:200px"></div>
<div class="ufo" style="left:110px;top:640px;width:90px;height:90px;opacity:.8"></div>
<svg class="abs" style="left:0;bottom:0" width="1080" height="700" viewBox="0 0 1080 700" preserveAspectRatio="none" id="tr"></svg>
<div class="abs" style="left:60px;top:890px;width:420px;height:300px;background:#E9DFC7;transform:rotate(-8deg);box-shadow:0 20px 50px rgba(0,0,0,.8);padding:26px;color:#1d1a15;font-family:J;font-size:22px;text-transform:none">
  <div>FORÇA AÉREA BRASILEIRA</div><div style="margin-top:14px;height:18px;width:300px;background:#111"></div><div style="margin-top:10px;height:18px;width:340px;background:#111"></div><div style="margin-top:10px;height:18px;width:220px;background:#111"></div>
  <div style="position:absolute;left:40px;top:150px;border:7px solid #E0282E;color:#E0282E;font-family:O;font-weight:700;font-size:54px;padding:2px 16px;transform:rotate(-6deg)">CONFIDENCIAL</div>
</div>
<div class="abs" style="left:170px;top:700px;width:1000px;height:1307px">
  <div class="abs" style="left:170px;top:-40px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(255,194,51,.4),rgba(255,194,51,0) 65%)"></div>
  <img src="host.png" style="position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 20px rgba(255,194,51,.6)) drop-shadow(0 30px 40px rgba(0,0,0,.8))">
</div>
<div class="abs" style="left:0;right:0;bottom:0;height:560px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.9) 55%)"></div>

<div class="abs t" style="left:0;right:0;top:260px;font-size:200px">OPERAÇÃO<br><span style="color:#FFC233">PRATO</span></div>
<div class="abs t" style="left:40px;right:40px;bottom:250px;font-size:112px">ELES <span style="color:#FFC233">ATACARAM</span><br>CIVIS NA AMAZÔNIA</div>
<div class="abs" style="left:0;right:0;bottom:120px;text-align:center"><span style="font-family:J;font-size:40px;letter-spacing:3px;color:#111;background:#FFC233;padding:12px 28px;border-radius:10px">E A FAB CONFIRMOU</span></div>
</div>
<script>
const c=document.getElementById('st').getContext('2d');function r(s){let x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<500;i++){c.fillStyle=`rgba(255,255,255,${.3+r(i+5)*.7})`;c.beginPath();c.arc(r(i)*1080,r(i+999)*1300,r(i+77)*2.4+.3,0,7);c.fill()}
let d='M0 700 L0 330 ';for(let x=0;x<=1080;x+=18)d+=`L${x} ${330-(Math.sin(x*.02)*40+Math.sin(x*.07)*25+r(x)*55)} `;d+='L1080 700Z';
document.getElementById('tr').innerHTML=`<path d="${d}" fill="#0b1712"/>`;
</script></body></html>
