<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:O;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(#02040a 0%,#071427 50%,#0f2a2a 78%,#050806 100%);font-family:O;font-weight:700;color:#fff;text-transform:uppercase}

</style></head><body><div id="c">

<svg class="abs" style="left:0;bottom:0" width="1080" height="700" viewBox="0 0 1080 700" preserveAspectRatio="none" id="tr"></svg>

<!-- beam -->
<svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ffe9" stop-opacity=".75"/><stop offset=".6" stop-color="#9dffc8" stop-opacity=".28"/><stop offset="1" stop-color="#9dffc8" stop-opacity=".05"/></linearGradient>
  <radialGradient id="hull" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#e9eef5"/><stop offset=".45" stop-color="#8c96a6"/><stop offset="1" stop-color="#2a303b"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a414d"/><stop offset=".5" stop-color="#c9d1dc"/><stop offset="1" stop-color="#3a414d"/></linearGradient>
  <radialGradient id="dome" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#eafff4"/><stop offset=".35" stop-color="#7dffc0" stop-opacity=".9"/><stop offset="1" stop-color="#0e5b3b" stop-opacity=".85"/></radialGradient>
  <radialGradient id="under" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#b8ffd8"/><stop offset="1" stop-color="#b8ffd8" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7dffc0" stop-opacity=".45"/><stop offset="1" stop-color="#7dffc0" stop-opacity="0"/></radialGradient>
  <filter id="bl"><feGaussianBlur stdDeviation="6"/></filter>
 </defs>
 <ellipse cx="560" cy="930" rx="520" ry="260" fill="url(#halo)"/>
 <path d="M470 985 L650 985 L950 1530 L170 1530 Z" fill="url(#beam)" filter="url(#bl)"/>
 <ellipse cx="560" cy="1525" rx="400" ry="55" fill="#c9ffe0" opacity=".35" filter="url(#bl)"/>
 <g transform="rotate(-8 560 930)">
  <ellipse cx="560" cy="975" rx="170" ry="34" fill="url(#under)" filter="url(#bl)"/>
  <ellipse cx="560" cy="945" rx="330" ry="62" fill="url(#hull)"/>
  <ellipse cx="560" cy="930" rx="330" ry="22" fill="url(#rim)" opacity=".9"/>
  <path d="M430 915 Q440 800 560 790 Q680 800 690 915 Z" fill="url(#dome)"/>
  <path d="M470 880 Q490 820 545 812" stroke="#fff" stroke-width="10" fill="none" opacity=".6" stroke-linecap="round"/>
  <g>
   <circle cx="275" cy="950" r="11" fill="#fff4b0"/><circle cx="345" cy="966" r="11" fill="#7dffc0"/><circle cx="420" cy="977" r="11" fill="#fff4b0"/><circle cx="490" cy="983" r="11" fill="#7dffc0"/>
   <circle cx="560" cy="985" r="12" fill="#fff4b0"/><circle cx="630" cy="983" r="11" fill="#7dffc0"/><circle cx="700" cy="977" r="11" fill="#fff4b0"/><circle cx="775" cy="966" r="11" fill="#7dffc0"/><circle cx="845" cy="950" r="11" fill="#fff4b0"/>
  </g>
 </g>
 <!-- people silhouettes in beam -->
 <g fill="#050806">
  <g transform="translate(470 1450)"><circle cx="0" cy="-92" r="18"/><path d="M-20 -72 H20 L26 10 L14 10 L10 70 H2 L0 14 L-2 70 H-10 L-14 10 L-26 10 Z"/><path d="M20 -66 L52 -120 L60 -114 L28 -58Z"/></g>
  <g transform="translate(650 1470) scale(.85)"><circle cx="0" cy="-92" r="18"/><path d="M-20 -72 H20 L26 10 L14 10 L10 70 H2 L0 14 L-2 70 H-10 L-14 10 L-26 10 Z"/><path d="M-20 -66 L-50 -118 L-58 -112 L-28 -58Z"/></g>
 </g>
</svg>
<div class="abs" style="left:40px;top:1120px;width:330px;height:270px;background:#E9DFC7;transform:rotate(-10deg);box-shadow:0 20px 50px rgba(0,0,0,.8);padding:26px;color:#1d1a15;font-family:J;font-size:22px;text-transform:none">
  <div>FORÇA AÉREA BRASILEIRA</div><div style="margin-top:14px;height:18px;width:230px;background:#111"></div><div style="margin-top:10px;height:18px;width:260px;background:#111"></div><div style="margin-top:10px;height:18px;width:170px;background:#111"></div>
  <div style="position:absolute;left:30px;top:170px;border:6px solid #E0282E;color:#E0282E;font-family:O;font-weight:700;font-size:40px;padding:2px 12px;transform:rotate(-6deg)">CONFIDENCIAL</div>
</div>

<div class="abs" style="left:0;right:0;bottom:0;height:420px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85) 60%)"></div>
<div class="abs" style="left:0;right:0;top:150px;text-align:center"><span style="font-family:J;font-size:40px;letter-spacing:6px;background:#E0282E;padding:10px 26px;border-radius:8px">ARQUIVO SECRETO · 1977</span></div>
<div class="abs t" style="left:0;right:0;top:260px;font-size:200px">OPERAÇÃO<br><span style="color:#FFC233">PRATO</span></div>
<div class="abs" style="left:0;right:0;top:668px;text-align:center"><span style="font-family:J;font-size:42px;letter-spacing:3px;color:#111;background:#FFC233;padding:12px 28px;border-radius:10px">A FAB CONFIRMOU OS ATAQUES</span></div>
<div class="abs t" style="left:30px;right:30px;bottom:95px;font-size:104px">ATACARAM <span style="color:#7dffc0">CIVIS</span><br>NA AMAZÔNIA</div>
</div>
<script>
const c=document.getElementById('st').getContext('2d');function r(s){let x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<500;i++){c.fillStyle=`rgba(255,255,255,${.3+r(i+5)*.7})`;c.beginPath();c.arc(r(i)*1080,r(i+999)*1300,r(i+77)*2.4+.3,0,7);c.fill()}
let d='M0 700 L0 330 ';for(let x=0;x<=1080;x+=18)d+=`L${x} ${330-(Math.sin(x*.02)*40+Math.sin(x*.07)*25+r(x)*55)} `;d+='L1080 700Z';
document.getElementById('tr').innerHTML=`<path d="${d}" fill="#0b1712"/>`;
</script></body></html>
