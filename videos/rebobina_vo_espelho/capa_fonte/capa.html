<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/bangers-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#FFD21F;font-family:B}
#rays{position:absolute;left:-600px;top:-500px;width:2280px;height:2280px;background:repeating-conic-gradient(from 0deg at 50% 50%,#FFB400 0 6deg,#FFD21F 6deg 12deg)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,120,0,.35) 3px,transparent 3.5px);background-size:22px 22px}
.abs{position:absolute}
.title{font-family:B;color:#FFE600;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:12px 12px 0 #E3001B,14px 14px 0 #000;letter-spacing:4px}
#panel{position:absolute;left:40px;top:430px;width:1000px;height:1250px;border:12px solid #000;background:#fff;transform:rotate(-2deg);box-shadow:18px 18px 0 #000;overflow:hidden}
#panel img{position:absolute;left:0;top:-40px;width:1000px}
#panel svg{position:absolute;left:0;top:-40px}
</style></head><body><div id="c">
<div id="rays"></div><div id="dots"></div>
